<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bases Científicas de la Medicina IV</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" type="module"></script>
</head>
<body>

  <header>
    <h1>Bases Científicas de la Medicina IV</h1>
  </header>

  <main>
    <nav aria-label="Navegación de evaluaciones">
      <button type="button" aria-pressed="true" data-prueba="1">Prueba 1</button>
      <button type="button" aria-pressed="false" data-prueba="2">Prueba 2</button>
      <button type="button" aria-pressed="false" data-prueba="3">Prueba 3</button>
    </nav>

    <!-- Contenedor dinámico de semanas -->
    <section id="weeks-container" aria-label="Contenido de semanas"></section>
  </main>
  <!-- Vista del examen (Oculta por defecto) -->
  <section id="exam-view" class="hidden" aria-hidden="true">
    <header class="exam-header">
      <button type="button" id="back-btn" aria-label="Volver atrás">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <h2 id="exam-title">Título</h2>
    </header>
    
    <div id="questions-container"></div>

    <!-- Contenedor de acciones y resultados -->
    <div class="exam-actions">
      <button type="button" id="submit-exam-btn" class="submit-btn">Entregar Examen</button>
      <div id="exam-results" class="results-box hidden"></div>
    </div>
  </section>
</body>
</html>
